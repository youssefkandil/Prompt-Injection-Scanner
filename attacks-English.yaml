changelog:
- version: 2.0-ar-en
  date: '2026-11-22'
  changes:
  - Kept only Arabic, Arabic dialects, English and mixed Arabic/English cases. Removed 10 other-language cases without translating
    them. Original IDs and all retained prompts are unchanged.
  - Preserved all encoded/partial disclosure, multi-turn, fixture, mock-tool and infrastructure test intents. No cases were
    reduced to match an existing scanner.
  - Restored the original core case-field order and dataset identity. Additional v2 fields remain after the original fields.
  - Made evaluation requirements explicit as a specification for future code; removed references to nonexistent scripts and
    CLI flags.
  - Aligned all canary_layered success criteria with the existing v2 layered-detection objective. Recounted statistics after
    language filtering.
- version: 2.1-ar-en
  date: '2026-11-22'
  changes:
  - Merged 51 English cases from the supplied Mixed External Sources dataset (gandalf/deepset/HackAPrompt adaptations). Removed
    its 15 German and 1 Spanish cases without translating them, per the Arabic/English-only rule.
  - Unified every case to the same 12 fields in the same order (id, category, language, name, severity, prompt, expected_behavior,
    success_criteria, detection_mode, notes, owasp_category, owasp_mapping_note). No per-case extra fields remain.
  - Moved prior per-case execution fields (tags, conversation_mode, turns, turn_evaluation, scenario, harness, test_type,
    fixture, severity_changed_from) into case_extensions, and external-source fields into source_attribution. No test data
    was deleted.
  - Added exact_substring and control_excluded detection-mode descriptions for the merged cases. Recounted statistics after
    the merge.
